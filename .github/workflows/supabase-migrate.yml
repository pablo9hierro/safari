name: Supabase Migrations

on:
  push:
    branches: [main, dev]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-migrate.yml'
  workflow_dispatch: # permite rodar manualmente pelo GitHub

jobs:
  migrate:
    name: Apply pending migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # supabase db push usa a Management API pra aplicar as migrations pendentes.
      # SUPABASE_ACCESS_TOKEN: gerado em https://supabase.com/dashboard/account/tokens
      # SUPABASE_PROJECT_REF: a parte final da URL do projeto (Settings → General)
      - name: Apply pending migrations
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
