<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smoke Element — reference</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
      }

      /* ==== Panel wrapper (delimited container + drag + transparent bg) ==== */
      .panel-smoke {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
        padding: 1.5rem 2.5rem 2.5rem;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 20px;
        background: transparent;
        cursor: grab;
        touch-action: none;
        z-index: 10;
      }

      .panel-smoke.dragging {
        cursor: grabbing;
        z-index: 100;
      }

      .panel-title {
        margin: 0;
        font-family: sans-serif;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #9aa0ab;
      }

      /* ==== Controls (range sliders) ==== */
      .controls {
        display: grid;
        grid-template-columns: auto 120px;
        align-items: center;
        gap: 0.5rem 0.75rem;
        font-family: sans-serif;
        font-size: 0.7rem;
        color: #c7cad1;
        cursor: default;
      }

      .controls label {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        white-space: nowrap;
      }

      .controls label span {
        min-width: 2.6em;
        color: #9fb0c7;
        font-variant-numeric: tabular-nums;
      }

      .controls input[type="range"] {
        width: 120px;
        accent-color: #6b8bff;
        cursor: pointer;
      }

      .stage {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        /* espaço extra acima pra fumaça subir sem ser cortada pelo overflow:hidden do painel */
        padding-top: 9rem;
      }

      /* ==== From Uiverse.io by esraaabdel-kareem (cup removido, só a fumaça) ==== */
      .smoke-loader {
        width: 100px;
        height: 100px;
        position: relative;
        animation: shake calc(3s / var(--smoke-speed, 1)) infinite ease-in-out;
      }

      .smoke {
        position: absolute;
        bottom: 100%;
        left: 50%;
        width: var(--smoke-puff-w, 10px);
        height: var(--smoke-puff-h, 25px);
        background: rgba(72, 67, 67, 0.501);
        border-radius: 50%;
        transform: translateX(-50%);
        animation: rise calc(3s / var(--smoke-speed, 1)) infinite ease-in-out;
        filter: blur(var(--smoke-blur, 8px));
      }

      .smoke.one {
        animation-delay: 0s;
      }
      .smoke.two {
        animation-delay: calc(0.8s / var(--smoke-speed, 1));
      }
      .smoke.three {
        animation-delay: calc(1.6s / var(--smoke-speed, 1));
      }

      @keyframes rise {
        0% {
          transform: translate(-50%, 0) scale(0.4);
          opacity: 0;
        }
        30% {
          opacity: 0.7;
        }
        60% {
          opacity: 0.4;
        }
        100% {
          transform: translate(-50%, -120px) scale(1);
          opacity: 0;
        }
      }

      @keyframes shake {
        0% {
          transform: translateX(0) translateY(0) rotate(0);
        }
        25% {
          transform: translateX(-4px) translateY(-2px) rotate(-2deg);
        }
        50% {
          transform: translateX(0) translateY(0) rotate(0);
        }
        75% {
          transform: translateX(4px) translateY(-2px) rotate(2deg);
        }
        100% {
          transform: translateX(0) translateY(0) rotate(0);
        }
      }
    </style>
  </head>
  <body>
    <section class="panel-smoke">
      <h2 class="panel-title">Smoke — by esraaabdel-kareem</h2>
      <div class="controls smoke-controls">
        <label for="smoke-blur-range">Blur <span id="smoke-blur-value">8px</span></label>
        <input type="range" id="smoke-blur-range" min="0" max="20" step="0.5" value="8" />

        <label for="smoke-count-range">Fumaças <span id="smoke-count-value">3</span></label>
        <input type="range" id="smoke-count-range" min="1" max="3" step="1" value="3" />

        <label for="smoke-width-range">Largura <span id="smoke-width-value">10px</span></label>
        <input type="range" id="smoke-width-range" min="2" max="40" step="1" value="10" />

        <label for="smoke-height-range">Altura <span id="smoke-height-value">25px</span></label>
        <input type="range" id="smoke-height-range" min="5" max="60" step="1" value="25" />

        <label for="smoke-speed-range">Velocidade <span id="smoke-speed-value">1x</span></label>
        <input type="range" id="smoke-speed-range" min="0.2" max="3" step="0.1" value="1" />
      </div>
      <div class="stage">
        <!-- From Uiverse.io by esraaabdel-kareem (cup removido, só a fumaça) -->
        <div class="smoke-loader">
          <div class="smoke one"></div>
          <div class="smoke two"></div>
          <div class="smoke three"></div>
        </div>
      </div>
    </section>

    <script>
      function bindRange(inputId, labelId, cssVar, { unit = "px", cssUnit = unit } = {}) {
        const input = document.getElementById(inputId);
        const label = document.getElementById(labelId);
        const apply = () => {
          document.documentElement.style.setProperty(cssVar, `${input.value}${cssUnit}`);
          label.textContent = `${input.value}${unit}`;
        };
        input.addEventListener("input", apply);
        apply();
      }

      function bindCount(inputId, labelId, selector) {
        const input = document.getElementById(inputId);
        const label = document.getElementById(labelId);
        const items = Array.from(document.querySelectorAll(selector));
        const apply = () => {
          const count = Number(input.value);
          items.forEach((el, i) => {
            el.style.display = i < count ? "" : "none";
          });
          label.textContent = count;
        };
        input.addEventListener("input", apply);
        apply();
      }

      function makeDraggable(panel, excludeSelector) {
        let drag = null;

        panel.addEventListener("pointerdown", (e) => {
          if (excludeSelector && e.target.closest(excludeSelector)) return;

          const rect = panel.getBoundingClientRect();
          if (panel.style.position !== "fixed") {
            panel.style.position = "fixed";
            panel.style.margin = "0";
            panel.style.top = `${rect.top}px`;
            panel.style.left = `${rect.left}px`;
          }

          drag = { offsetX: e.clientX - rect.left, offsetY: e.clientY - rect.top };
          panel.classList.add("dragging");
          panel.setPointerCapture(e.pointerId);
        });

        panel.addEventListener("pointermove", (e) => {
          if (!drag) return;
          panel.style.left = `${e.clientX - drag.offsetX}px`;
          panel.style.top = `${e.clientY - drag.offsetY}px`;
        });

        function endDrag(e) {
          if (!drag) return;
          drag = null;
          panel.classList.remove("dragging");
          panel.releasePointerCapture(e.pointerId);
        }

        panel.addEventListener("pointerup", endDrag);
        panel.addEventListener("pointercancel", endDrag);
      }

      bindRange("smoke-blur-range", "smoke-blur-value", "--smoke-blur");
      bindRange("smoke-width-range", "smoke-width-value", "--smoke-puff-w");
      bindRange("smoke-height-range", "smoke-height-value", "--smoke-puff-h");
      bindRange("smoke-speed-range", "smoke-speed-value", "--smoke-speed", { unit: "x", cssUnit: "" });
      bindCount("smoke-count-range", "smoke-count-value", ".smoke-loader .smoke");

      makeDraggable(document.querySelector(".panel-smoke"), ".smoke-controls");
    </script>
  </body>
</html>
