<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fire Element — reference</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
      }

      /* ==== Panel wrapper (delimited container + drag + transparent bg) ==== */
      .panel-fire {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
        padding: 1.5rem 2.5rem 2.5rem;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 20px;
        background: transparent;
        cursor: grab;
        touch-action: none;
        z-index: 10;
      }

      .panel-fire.dragging {
        cursor: grabbing;
        z-index: 100;
      }

      .panel-title {
        margin: 0;
        font-family: sans-serif;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #9aa0ab;
      }

      /* ==== Controls (range sliders) ==== */
      .controls {
        display: grid;
        grid-template-columns: auto 120px;
        align-items: center;
        gap: 0.5rem 0.75rem;
        font-family: sans-serif;
        font-size: 0.7rem;
        color: #c7cad1;
        cursor: default;
      }

      .controls label {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        white-space: nowrap;
      }

      .controls label span {
        min-width: 2.6em;
        color: #ff9a4d;
        font-variant-numeric: tabular-nums;
      }

      .controls input[type="range"] {
        width: 120px;
        accent-color: #ff6b35;
        cursor: pointer;
      }

      .stage {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }

      /* ==== From Uiverse.io by SelfMadeSystem (overlay/blur removido; blur agora é por bolinha via --ball-blur) ==== */
      .loader {
        position: relative;
        width: var(--fire-w, 133px);
        height: var(--fire-h, 200px);
        max-height: 80%;
      }

      .ball {
        position: absolute;
        bottom: 0;
        --a: 32.02135;
        --w: 24px;
        --m: 10px;
        --b: mod(var(--n) * var(--a), 1);
        left: calc((100% - var(--w)) * var(--b));
        width: var(--w);
        height: var(--w);
        background: radial-gradient(closest-side, #fff, #f50, #f00, #f300);
        border-radius: 0% 100%;
        filter: blur(var(--ball-blur, 2px));
        translate: calc(-1 * var(--m)) 0;
        animation-name: ball-wee, ball-bf;
        animation-duration: calc(2s / var(--speed, 1)), calc(1.756s / var(--speed, 1));
        animation-delay: calc(var(--n) * -2s / var(--speed, 1)),
          calc(mod(var(--n) * 6, 1) * -1.232s / var(--speed, 1));
        animation-timing-function: linear, ease-in-out;
        animation-iteration-count: infinite, infinite;
      }

      @keyframes ball-wee {
        from {
          scale: 0;
          opacity: 0;
        }
        5% {
          opacity: 1;
        }
        15% {
          scale: 1;
        }
        to {
          left: calc(50% - var(--w) * 0.5 + (25%) * (var(--b) * 2 - 1));
          bottom: calc(100% - 24px);
          scale: 0;
          rotation: 180deg;
        }
      }

      @keyframes ball-bf {
        50% {
          translate: var(--m) 0;
        }
      }
    </style>
  </head>

    <script>
      function bindRange(inputId, labelId, cssVar, { unit = "px", cssUnit = unit } = {}) {
        const input = document.getElementById(inputId);
        const label = document.getElementById(labelId);
        const apply = () => {
          document.documentElement.style.setProperty(cssVar, `${input.value}${cssUnit}`);
          label.textContent = `${input.value}${unit}`;
        };
        input.addEventListener("input", apply);
        apply();
      }

      function bindCount(inputId, labelId, selector) {
        const input = document.getElementById(inputId);
        const label = document.getElementById(labelId);
        const items = Array.from(document.querySelectorAll(selector));
        const apply = () => {
          const count = Number(input.value);
          items.forEach((el, i) => {
            el.style.display = i < count ? "" : "none";
          });
          label.textContent = count;
        };
        input.addEventListener("input", apply);
        apply();
      }

      function makeDraggable(panel, excludeSelector) {
        let drag = null;

        panel.addEventListener("pointerdown", (e) => {
          if (excludeSelector && e.target.closest(excludeSelector)) return;

          const rect = panel.getBoundingClientRect();
          if (panel.style.position !== "fixed") {
            panel.style.position = "fixed";
            panel.style.margin = "0";
            panel.style.top = `${rect.top}px`;
            panel.style.left = `${rect.left}px`;
          }

          drag = { offsetX: e.clientX - rect.left, offsetY: e.clientY - rect.top };
          panel.classList.add("dragging");
          panel.setPointerCapture(e.pointerId);
        });

        panel.addEventListener("pointermove", (e) => {
          if (!drag) return;
          panel.style.left = `${e.clientX - drag.offsetX}px`;
          panel.style.top = `${e.clientY - drag.offsetY}px`;
        });

        function endDrag(e) {
          if (!drag) return;
          drag = null;
          panel.classList.remove("dragging");
          panel.releasePointerCapture(e.pointerId);
        }

        panel.addEventListener("pointerup", endDrag);
        panel.addEventListener("pointercancel", endDrag);
      }

      bindRange("blur-range", "blur-value", "--ball-blur");
      bindRange("width-range", "width-value", "--fire-w");
      bindRange("height-range", "height-value", "--fire-h");
      bindRange("speed-range", "speed-value", "--speed", { unit: "x", cssUnit: "" });
      bindCount("count-range", "count-value", ".fire .ball");

      makeDraggable(document.querySelector(".panel-fire"), ".fire-controls");
    </script>
