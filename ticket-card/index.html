<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ticket Card — Uiverse clone</title>
    <link rel="stylesheet" href="./style.css" />

    <div class="page">
      <section class="panel">
        <h2 class="panel-title">Ticket — by dexter-st</h2>
        <div class="stage">
        <!-- From Uiverse.io by dexter-st -->
        <div class="card">
          <div class="notes">♪♪♪♪♪</div>
          <div class="notes">♪♪♪♪</div>
          <div class="notes">♪♪♪♪♪</div>

          <div class="header">
            TICKET
            <div class="symbol">✁</div>
          </div>
          <div class="body">
            <em>Day pass</em><br />
            May 14<sup>th</sup> 2026<br />
            Venue address, State, #####
          </div>
          <div class="footer">
            <div class="number">Seat <span class="bold">E7</span></div>
            <div class="barcode"></div>
          </div>

          <div class="bg holographic"></div>
          <svg class="filter">
            <filter id="bump">
              <feTurbulence
                result="noise"
                numOctaves="3"
                baseFrequency="0.7"
                type="fractalNoise"
              ></feTurbulence>
              <feSpecularLighting
                in="noise"
                result="specular"
                lighting-color="#fffffc"
                specularExponent="25"
                specularConstant="0.8"
                surfaceScale="0.15"
              >
                <fePointLight z="210" y="100" x="100"></fePointLight>
              </feSpecularLighting>
              <feComposite
                result="noise2"
                operator="in"
                in="specular"
                in2="SourceGraphic"
              ></feComposite>
              <feBlend mode="screen" in2="noise2" in="SourceGraphic"></feBlend>
            </filter>
          </svg>
        </div>
        </div>
      </section>

      <section class="panel panel-smoke">
        <h2 class="panel-title">Smoke — by esraaabdel-kareem</h2>
        <div class="controls smoke-controls">
          <label for="smoke-blur-range">Blur <span id="smoke-blur-value">8px</span></label>
          <input type="range" id="smoke-blur-range" min="0" max="20" step="0.5" value="8" />

          <label for="smoke-count-range">Fumaças <span id="smoke-count-value">3</span></label>
          <input type="range" id="smoke-count-range" min="1" max="3" step="1" value="3" />

          <label for="smoke-width-range">Largura <span id="smoke-width-value">10px</span></label>
          <input type="range" id="smoke-width-range" min="2" max="40" step="1" value="10" />

          <label for="smoke-height-range">Altura <span id="smoke-height-value">25px</span></label>
          <input type="range" id="smoke-height-range" min="5" max="60" step="1" value="25" />

          <label for="smoke-speed-range">Velocidade <span id="smoke-speed-value">1x</span></label>
          <input type="range" id="smoke-speed-range" min="0.2" max="3" step="0.1" value="1" />
        </div>
        <div class="stage stage-smoke">
        <!-- From Uiverse.io by esraaabdel-kareem (cup removido, só a fumaça) -->

          <div class="smoke one"></div>
          <div class="smoke two"></div>
          <div class="smoke three"></div>
        </div>
        </div>

      <section class="panel">
        <h2 class="panel-title">Coupon Slot — by dexter-st (com ticket)</h2>
        <div class="stage stage-coupon">
          <!-- From Uiverse.io by dexter-st, papel substituído pelo ticket -->
          <div class="coupon-wrapper">
            <div class="cutout-wrapper">
              <div class="cutout"></div>
            </div>
            <div class="paper-wrapper">
              <div class="sec">
                <button class="paper">
                  <div class="card card-coupon">
                    <div class="header">
                      Cupom
                      <div class="symbol">✁</div>
                    </div>
                    <div class="body">
                      <em>Cupom Exclusivo</em><br />
                      Válido até 14/Maio<br />
                      Venue address, State, #####
                    </div>
                    <div class="footer">
                      <div class="number">Código <span class="bold">CodigoCupom15</span></div>
                      <div class="barcode"></div>
                    </div>

                    <div class="bg holographic"></div>
                    <svg class="filter">
                      <filter id="bump-coupon">
                        <feTurbulence
                          result="noise"
                          numOctaves="3"
                          baseFrequency="0.7"
                          type="fractalNoise"
                        ></feTurbulence>
                        <feSpecularLighting
                          in="noise"
                          result="specular"
                          lighting-color="#fffffc"
                          specularExponent="25"
                          specularConstant="0.8"
                          surfaceScale="0.15"
                        >
                          <fePointLight z="210" y="100" x="100"></fePointLight>
                        </feSpecularLighting>
                        <feComposite
                          result="noise2"
                          operator="in"
                          in="specular"
                          in2="SourceGraphic"
                        ></feComposite>

                      </filter>
                    </svg>
